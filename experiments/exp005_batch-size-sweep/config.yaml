# Overrides on top of ../../configs/default.yaml — only put what changes here.
model: Qwen/Qwen2.5-7B-Instruct
max_model_len: 4096
gpu_memory_utilization: 0.90

# workload — sweep n_prompts, everything else fixed
batch_sizes: [1, 4, 8, 16, 32, 64, 128, 256]
max_tokens: 128        # output tokens per request (ignore_eos so every point is comparable)
temperature: 0.7
seed: 0
