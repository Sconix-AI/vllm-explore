[project]
name = "vllm-explore"
version = "0.1.0"
description = ""
requires-python = ">=3.12"
dependencies = [
    "sconixlib",
    "pyyaml>=6",
    "rich>=13",
    "numpy>=1.26",
    "torch>=2.7",
    "vllm>=0.26.0",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "pre-commit>=4"]
viz = ["matplotlib>=3.8", "pandas>=2"]
# for `task lab` and `task report` (Quarto executes the .qmd with jupyter)
notebook = ["jupyterlab>=4", "ipykernel>=6", "jupyter-cache>=1"]

[tool.uv.sources]
sconixlib = { path = "/home/sconix/research/os/sconixlib", editable = true }

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vllm_explore"]
