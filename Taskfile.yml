# Every project speaks the same 6 verbs.
version: "3"

vars:
  # inline on python-spawning cmds — go-task env: won't override an ambient
  # TMPDIR, and /mnt/* temp dirs break pytest capture + sqlite.
  # VLLM_WSL2_ENABLE_PIN_MEMORY: vllm disables pinned memory (and thus UVA)
  # by default under WSL2 even on kernels new enough to support it.
  # CUDA_HOME: a stray system /usr/bin/nvcc (CUDA 11.5, apt leftover) beats
  # the venv's real CUDA13 toolchain in `which nvcc` lookups; flashinfer's
  # arch detection needs the real one to recognize sm_120 (RTX 5090).
  # NVCC_APPEND_FLAGS: uv resolved nvidia-cuda-nvcc==13.3.73 against
  # nvidia-cuda-runtime==13.0.96 (independently-versioned pip packages) —
  # flashinfer's CCCL headers refuse that skew by default; this is NVIDIA's
  # own documented escape hatch for a newer-CTK-than-compiler mismatch.
  PY: TMPDIR=/tmp VLLM_WSL2_ENABLE_PIN_MEMORY=1 CUDA_HOME=/home/sconix/research/projects/vllm-explore/.venv/lib/python3.12/site-packages/nvidia/cu13 NVCC_APPEND_FLAGS=-DCCCL_DISABLE_CTK_COMPATIBILITY_CHECK uv run

tasks:
  setup:
    desc: Create the venv and install everything
    cmds:
      - TMPDIR=/tmp uv sync --all-groups
      - "{{.PY}} python -c 'import sconixlib; print(\"sconixlib\", sconixlib.__version__, \"ok\")'"

  run:
    desc: "Run an experiment (default: exp001_smoke). Usage: task run -- exp002_foo"
    cmds:
      # auto-commit so this run's env.json records a clean git sha, not a
      # dirty diff — no-op if the tree is already clean.
      - |
        if [ -n "$(git status --porcelain)" ]; then
          git add -A
          git commit -q -m "auto-snapshot before run: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "[sconix] committed working changes before run ($(git rev-parse --short HEAD))"
        fi
      - "{{.PY}} python experiments/{{.CLI_ARGS | default \"exp001_smoke\"}}/run.py"

  exp:
    desc: "Scaffold a new experiment. Usage: task exp -- short-name"
    cmds:
      - "{{.PY}} python scripts/new_experiment.py {{.CLI_ARGS}}"

  report:
    desc: Render report.qmd -> report.html
    cmds:
      - TMPDIR=/tmp uv run quarto render report.qmd

  lab:
    desc: Launch JupyterLab in ./notebooks
    cmds:
      - "{{.PY}} jupyter lab --notebook-dir=notebooks --no-browser"

  compare:
    desc: Table of every run in results/
    cmds:
      - "{{.PY}} python scripts/compare.py"

  lint:
    desc: Format + lint + fast tests
    cmds:
      - uv run ruff format .
      - uv run ruff check --fix .
      - TMPDIR=/tmp uv run pytest

  test:
    cmds:
      - TMPDIR=/tmp uv run pytest
